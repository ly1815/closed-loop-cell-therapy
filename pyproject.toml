[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-loop-cell-therapy"
version = "0.2.0"
description = "A virtual CAR-T perfusion expansion and digital shadow, built on Egan et al. (2025)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luxi Yu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# added in later steps
devices = ["asyncua>=1.1", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.6"]
app = ["streamlit>=1.35", "plotly>=5.20", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
